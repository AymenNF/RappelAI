name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: memorae
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: memorae_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U memorae -d memorae_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgresql://memorae:test_only@localhost:5432/memorae_test
      TEST_DATABASE_URL: postgresql://memorae:test_only@localhost:5432/memorae_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run db:migrate
      - run: npm run db:migrate
      - run: npm run test:integration
