# Local dependencies only. These credentials and ports are not a production setup.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: memorae
      POSTGRES_PASSWORD: memorae_local_only
      POSTGRES_DB: memorae
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U memorae -d memorae']
      interval: 5s
      timeout: 3s
      retries: 15
  redis:
    image: redis:7-alpine
    profiles: ['queue']
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  postgres_data:
  redis_data:
